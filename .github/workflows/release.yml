# Builds every bundle for a tagged version and attaches them to a draft release.
#
#   bun run bump   → pick a version; it commits, tags vX.Y.Z and pushes
#   the tag push   → this
#
# The release is left as a *draft*: check the artifacts, write the notes, then
# publish. Nothing here signs anything, so macOS and Windows both warn on first
# launch — the alternative is a paid certificate on each.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.4.0)'
        required: false
        default: 'v0.4.0'

permissions:
  contents: write

# Baked into the frontend bundle at build time (nuxt.config runtimeConfig).
env:
  TMDB_API: ${{ secrets.TMDB_API }}
  # Node sizes its heap from the machine's RAM, and the macOS runner has half of
  # what the others do — so `nuxt generate` prerendering 72 locales died at a
  # 2 GB ceiling there while passing everywhere else. Give every runner the same
  # headroom rather than the Mac a special case.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: the .deb and .AppImage link against the
          # runner's glibc, so building on the oldest supported one is what
          # makes them run anywhere else.
          - os: ubuntu-22.04
            args: ''
            targets: ''
          # Native, so NSIS *and* the .msi come out — neither cross-compiles.
          - os: windows-latest
            args: ''
            targets: ''
          # Apple Silicon only. A universal build would have to link a universal
          # libmpv, and Homebrew bottles are single-arch — the x86_64 half fails
          # at the linker. An Intel .dmg needs an Intel runner, not a flag.
          - os: macos-latest
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: bun install --frozen-lockfile

      # Windows ships no mpv, so the bundle carries one (tauri.windows.conf.json).
      - if: runner.os == 'Windows'
        run: bun scripts/build/mpv.ts

      # macOS links libmpv instead of launching mpv, so it is needed to build at
      # all. Carrying it — and the ffmpeg tree behind it — into the .app is then
      # scripts/build/macos/bundle-dylib.ts, via the beforeBundleCommand hook,
      # which needs only otool and install_name_tool from the Xcode command line
      # tools the runner image already has.
      - if: runner.os == 'macOS'
        run: brew install mpv

      # Uploads the bundles *and* latest.json, which is what the in-app updater
      # reads. Each runner merges its own platforms into the copy already on the
      # release, so one file ends up describing all three — and it is written
      # only if the bundler produced .sig files, i.e. only if the signing key
      # below actually reached it. A release with no latest.json means that
      # secret is missing: the app then still says a version is out, and points
      # at the release page instead of installing it.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Surfex ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true

      # tauri-action drives the bundler itself, so scripts/build/index.ts — and
      # the AppImage repack it ends with — never runs here. Do it to the bundle
      # tauri-action left behind and replace the asset it just uploaded, or the
      # AppImage aborts at startup on every distro newer than this runner.
      - if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          bun scripts/build/linux/appimage.ts
          gh release upload "${{ github.event.inputs.tag || github.ref_name }}" \
            src-tauri/target/release/bundle/appimage/*.AppImage --clobber

      # Hand that signature to the `updater` job if present.
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: appimage-signature
          path: src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: ignore

      # The runner has Homebrew, so a .dmg that still depends on it looks fine
      # here and fails on every other Mac. Fail the release instead.
      - if: runner.os == 'macOS'
        run: bun scripts/build/macos/bundle-dylib.ts src-tauri/target/release/bundle/macos/Surfex.app

  updater:
    needs: desktop
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: appimage-signature
          path: appimage-signature
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/build/linux/appimage-signature.ts "${{ github.event.inputs.tag || github.ref_name }}" appimage-signature/*.AppImage.sig || true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/surfex.jks"
            echo "Signing with the release keystore."
          fi

      - run: bun run build:android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/surfex.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify the APK is signed
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "::error::No APK found in build outputs."
            ls -la src-tauri/gen/android/app/build/outputs/apk/ || true
            exit 1
          fi
          echo "Found APK at: $apk"

      - name: Attach the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$apk" "Surfex_${ver}.apk"
          cp "$apk" Surfex.apk
          gh release upload "$tag" "Surfex_${ver}.apk" Surfex.apk --clobber
